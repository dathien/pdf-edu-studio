  <body class="bg-[#F4F8F7] text-[#1F2937] antialiased selection:bg-[#087F70]/20 selection:text-[#164E63]">
    <div id="root"></div>
    <script>
      globalThis.PACKAGE_VERSION = '3.2.2';
      (function () {
        try {
          var host = window.location.hostname || '';
          var isDevPreview =
            host.indexOf('ais-dev-') === 0 || host === 'localhost' || host === '127.0.0.1';
          if (isDevPreview && 'serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (!regs.length) return;
              Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
                if ('caches' in window) {
                  caches.keys().then(function (keys) {
                    Promise.all(
                      keys
                        .filter(function (k) { return k.indexOf('pdf-edu-studio-') === 0; })
                        .map(function (k) { return caches.delete(k); })
                    ).then(function () {
                      if (!sessionStorage.getItem('pdf_edu_sw_cleaned')) {
                        sessionStorage.setItem('pdf_edu_sw_cleaned', '1');
                        window.location.reload();
                      }
                    });
                  });
                }
              });
            });
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
